<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewellery Stock Management - API Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        .login-form {
            margin: 30px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .response {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .response h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
        }
        .credentials {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }
        .credentials h4 {
            color: #1976d2;
            margin-bottom: 10px;
        }
        .credentials p {
            margin: 5px 0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💎 Jewellery Stock Management</h1>
        <p class="subtitle">Backend API Demo</p>
        
        <div id="serverStatus" class="status">
            Checking server status...
        </div>

        <div class="credentials">
            <h4>🔑 Default Login Credentials</h4>
            <p><strong>Admin:</strong> Mobile: 9999999999 | Password: admin123</p>
            <p><strong>Staff:</strong> Mobile: 8888888888 | Password: staff123</p>
        </div>

        <div class="login-form">
            <h2>Test Login API</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="text" id="mobile" value="9999999999" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" value="admin123" required>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>

        <div id="response" style="display: none;" class="response">
            <h3>API Response:</h3>
            <pre id="responseData"></pre>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        // Check server status
        async function checkServer() {
            const statusDiv = document.getElementById('serverStatus');
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                statusDiv.className = 'status success';
                statusDiv.textContent = `✅ Backend Server is Running! ${data.message}`;
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Backend Server is not running. Please start it with: npm run dev';
            }
        }

        // Handle login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const mobile = document.getElementById('mobile').value;
            const password = document.getElementById('password').value;
            const responseDiv = document.getElementById('response');
            const responseData = document.getElementById('responseData');

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ mobile, password })
                });

                const data = await response.json();
                responseDiv.style.display = 'block';
                responseData.textContent = JSON.stringify(data, null, 2);

                if (data.success) {
                    alert(`✅ Login Successful!\nWelcome ${data.data.user.name}!\nRole: ${data.data.user.role}`);
                }
            } catch (error) {
                responseDiv.style.display = 'block';
                responseData.textContent = `Error: ${error.message}`;
            }
        });

        // Check server on load
        checkServer();
    </script>
</body>
</html>
