name: jewellery_stock_app
description: Jewellery Stock & Container Management Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Barcode Scanning - Using mobile_scanner for camera scanning
  mobile_scanner: ^3.5.2
  
  # Barcode Generation
  barcode_widget: ^2.0.4
  
  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  
  # Localization
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  
  # PDF & Excel
  pdf: ^3.10.7
  printing: ^5.12.0
  excel: ^4.0.2
  path_provider: ^2.1.2
  
  # Audio Feedback
  audioplayers: ^5.2.1
  
  # Utilities
  uuid: ^4.3.3
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  http_parser: ^4.0.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
  
  # Fonts (optional - using Google Fonts instead)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
